name: import-smoke

# Installs wsds fresh with ONLY its declared dependencies and imports it. This is the one check
# that catches an imported-but-undeclared dependency: a normal pytest run happens in a dev/ML
# environment where such a package is already present transitively (e.g. flatbuffers, pulled by
# tensorflow/onnx/mediapipe), so it hides the missing declaration. A clean install surfaces it.
on:
  push:
  pull_request:

jobs:
  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install wsds (fresh env — only its declared deps)
        run: |
          python -m pip install -U pip
          # CPU torch to keep the runner light; wsds declares torch, this just satisfies it early.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install .
      - name: Import wsds — fails if anything imported is not a declared dependency
        run: python -c "import wsds; print('import wsds OK')"
